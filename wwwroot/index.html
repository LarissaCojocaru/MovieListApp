<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My movie list</h1>

        <div class="form-section">
            <input type="text" id="title" placeholder="Film title...">
            <input type="text" id="genre" placeholder="Genre...">
            <input type="number" id="year" placeholder="Year...">
            <button onclick="addMovie()">Add film</button>
        </div>

        <table id="movieTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="movieList">
                <!-- Rows are rendered here from the API -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
