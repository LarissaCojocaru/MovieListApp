<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>To Do App - Filme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lista mea de Filme</h1>

        <div class="form-section">
            <input type="text" id="titlu" placeholder="Titlul filmului...">
            <input type="text" id="gen" placeholder="Genul...">
            <input type="number" id="an" placeholder="Anul...">
            <button onclick="adaugaFilm()">Adaugă Film</button>
        </div>

        <table id="tabelFilme">
            <thead>
                <tr>
                    <th>Titlu</th>
                    <th>Gen</th>
                    <th>An</th>
                    <th>Acțiune</th>
                </tr>
            </thead>
            <tbody id="listaFilme">
                <!-- Aici vor apărea filmele din baza de date -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
